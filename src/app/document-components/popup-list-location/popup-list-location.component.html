<div class="modal fade" [id]="id" tabindex="-1" role="dialog" [attr.aria-labelledby]="id+'modalTitle'" data-backdrop="static" aria-hidden="true" [attr.data-keyboard]="allowEscape">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="id+'-title'">{{title}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" *ngIf="allowEscape">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">

        <div class="container-fluid div-content-box-without-header">
          <table class="table table-striped table-fullwidth table-hover cdss-table">
            <thead>
              <tr>
                <th></th>
                <th>ชื่อสถานที่</th>
                <th>ที่อยู่</th>
                <th>เบอร์โทร</th>
                <th>โทรสาร</th>
                <th>สำหรับ</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody *ngIf="showData">
              <tr *ngFor=" let item of Datasource; let idx = index ">
                <td class="cdss-col-select"><button class="btn btn-link btn-sm" (click)="selectLocation(item)">เลือก</button></td>
                <td>{{item.LOCATION_NAME}}</td>
                <td>{{transform.addressToString(item)}}</td>
                <td class="cdss-col-nowrap">{{item.PHONE_NO}}</td>
                <td class="cdss-col-nowrap">{{item.FAX_NO}}</td>
                <td>{{transform.typeOfLocation(item.FOR_PRODUCTION)}}</td>
                <td>{{item.NOTE1}}</td>
              </tr>
              <tr [hidden]="!isLoading" class="rowLoading">
                <td colspan="7">
                  <cdss-loading></cdss-loading>
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="7">
                  {{getFooter}}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        <cdss-datagrid-pagination #pg></cdss-datagrid-pagination>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDialog()">Cancel</button>
        <button type="button" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>
</div>
