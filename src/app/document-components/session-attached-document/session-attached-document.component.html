<div class="container-fluid div-content-box" id="div-section-attached-document">
    <div class="div-content-box-header">
      <i class="fa fa-info-circle" aria-hidden="true"></i> {{Title}}
    </div>
    <div class="div-content-box_suggestion is-warning">
      หมายเหตุ: กรุณาตั้งชื่อไฟล์เอกสารที่แนบมาให้สอดคล้องกับรายการเอกสารที่ติ๊กเลือก
    </div>
    <div class="form-row">
      <div class="col-12 line-gap">

        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-01" (change)="changeCheckInclude(1)" [checked]="getSequenceCheck(1)">
          <label class="custom-control-label" for="print-include-01">หนังสือรับรองบริษัท</label>
        </div>
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-02" (change)="changeCheckInclude(2)" [checked]="getSequenceCheck(2)">
          <label class="custom-control-label" for="print-include-02">หนังสือมอบอำนาจ (ติดอากรแสตมป์ ๑๐ บาท)</label>
        </div>
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-03" (change)="changeCheckInclude(3)" [checked]="getSequenceCheck(3)">
          <label class="custom-control-label" for="print-include-03">สำเนาทะเบียนบ้านและสำเนาบัตรประจำตัวประชาชนกรรมการ</label>
        </div>
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-04" (change)="changeCheckInclude(4)" [checked]="getSequenceCheck(4)">
          <label class="custom-control-label" for="print-include-04">สำเนาทะเบียนบ้านและสำเนาบัตรประจำตัวประชาชนผู้รับมอบอำนาจ</label>
        </div>
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-05" (change)="changeCheckInclude(5)" [checked]="getSequenceCheck(5)">
          <label class="custom-control-label" for="print-include-05">เอกสารความปลอดภัย MSDS</label>
        </div>
        <div class="custom-control custom-checkbox">
          <input type="checkbox" class="custom-control-input" id="print-include-06" (change)="changeCheckInclude(6)" [checked]="getSequenceCheck(6)">
          <label class="custom-control-label" for="print-include-06">คุณสมบัติหรือคุณลักษณะของผลิตภัณฑ์/สารเคมี ภาษาไทย และภาษาอังกฤษ</label>
        </div>
        
      </div>
    </div>

    

    
</div>
