<div class="container-fluid div-content-box" id="div-section-payment-type">
  <div class="div-content-box-header">
    <i class="fa fa-money" aria-hidden="true"></i> {{Title}}
  </div>
  <div class="div-content-box_suggestion is-warning">
    <!-- #message suggestion -->
  </div>

  <div class="form-group row">    
    <label for="paymentTypeDropdown" class="col-sm-3 col-form-label col-form-label-sm" style="text-align:right;">
      วิธีการชำระเงิน
    </label>
    <div class="col-sm-4">

      <select disabled class="form-control form-control-sm" id="paymentTypeDropdown" [(ngModel)]="selectedPaymentMethod" [ngModelOptions]="{standalone: true}" (change)="changePaymenyMethod()">
        <option *ngFor=" let item of PaymentList " [value]="item.code">{{item.title}}</option>
      </select>
      <div class="invalid-feedback">กรุณาเลือกวิธีการชำระเงิน</div>
    </div>
    <div class="col-sm-5">
      <!--<div class="form-check">
        <input class="form-check-input" type="checkbox" id="gridCheck1">
        <label class="form-check-label" for="gridCheck1">เร่งด่วน</label>
      </div>-->
    </div>
  </div>


</div>
