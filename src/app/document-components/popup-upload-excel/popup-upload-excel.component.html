<div class="modal fade" [id]="id" tabindex="-1" role="dialog" [attr.aria-labelledby]="id+'modalTitle'" data-backdrop="static" aria-hidden="true" data-keyboard="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="id+'-title'">{{title}}นำเข้าผนวกแนบท้ายใบอนุญาตจาก Excel (xlsx)</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" *ngIf="allowEscape">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [id]="formID">
          <input class="form-control-sm" type="file" name="files[]" accept=".xlsx" (change)="onFileChange($event)" [hidden]="true" [id]="id+'excelUpload'" />
        </form>
        <div class="container-fluid div-content-box-without-header" style="padding-top:15px;">
          <div class="form-group">
            <div class="input-group input-group-sm col-xs-12">
              <div class="input-group-prepend">
                <span class="input-group-text" id="basic-addon1">
                  <i class="fa fa-file-excel-o"></i>
                </span>
              </div>
              <input type="text" class="form-control form-control-sm" disabled placeholder="Upload Excel (XLSX file)">
              <div class="input-group-append">
                <button class="input-group-text" (click)="showDialogBrowser()">
                  <i class="fa fa-folder-open" aria-hidden="true"></i> Browse...</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeDialog()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
