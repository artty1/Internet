<div class="modal fade" [id]="id" tabindex="-1" role="dialog" [attr.aria-labelledby]="id+'modalTitle'" data-backdrop="static" aria-hidden="true" data-keyboard="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="id+'-title'">{{title}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">

        <table class="table table-striped table-hover table-fullwidth table-sm" style="font-size: 0.875rem;">
          <thead>
            <tr>
              <th class="text-center cdss">&nbsp;</th>
              <th class="text-center cdss">ลำดับ</th>
              <th class="text-center cdss">ชื่อยุทธภัณฑ์</th>
              <th class="text-center cdss">ยี่ห้อ</th>
              <th class="text-center cdss">รุ่น</th>
              <th class="text-center cdss">รายละเอียดเพิ่ม</th>
              <th class="text-center cdss">จำนวน</th>
              <th class="text-center cdss">น้ำหนัก</th>
              <th class="text-center cdss">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor=" let item of AppendixList; let idx = index;">
              <td>
                <button class="btn btn-link" (click)="swapSelect(item)">{{ getCaptionOfSwapButton(item) }}</button>
              </td>
              <td [class]="getClass(item)">{{idx+1}}</td>
              <td [class]="getClass(item)">{{item.name}}</td>
              <td [class]="getClass(item)">{{item.brandname}}</td>
              <td [class]="getClass(item)">{{item.series}}</td>
              <td [class]="getClass(item)">{{item.description}}</td>
              <td [class]="getClass(item)">{{item.qty}} {{item.qty_unit_name}}</td>
              <td [class]="getClass(item)">{{item.weight}} {{item.weight_unit_name}}</td>
              <td [class]="getClass(item)">{{item.remark}}</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="grd-footer txt-left">
                <button class="btn btn-link" (click)="swapSelectAll()">{{ getCaptionOfSelectAll }}</button>
              </td>
              <td colspan="6" class="grd-footer">
                {{Footer}}
              </td>
            </tr>
          </tfoot>
        </table>


      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancelData()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveData()" [disabled]="!isEnabledOK">OK</button>
      </div>
    </div>
  </div>
</div>
