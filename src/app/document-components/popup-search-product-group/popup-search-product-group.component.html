<div class="modal fade" [id]="id" tabindex="-1" role="dialog" [attr.aria-labelledby]="id+'modalTitle'" data-backdrop="static" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="id+'-title'">{{title}}ค้นหาชนิดยุทธภัณฑ์</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">

        <div class="container-fluid">
          <div class="form-group row">
            <label for="inputPassword" class="col-sm-2 col-form-label col-form-label-sm">ข้อมูลที่ต้องการค้นหา</label>
            <div class="col-sm-10">
              <div class="input-group input-group-sm mb-2">
                <input type="text" class="form-control form-control-sm" id="txtProductGroupCriteria" placeholder="พิมพ์คำที่ต้องการค้นหาหรือบางส่วนของคำ" [(ngModel)]="CriteriaSearch">
                <div class="input-group-append">
                  <button class="input-group-text" (click)="clearCriteria()"><i class="fa fa-times" aria-hidden="true"></i></button>
                </div>
              </div>
              
            </div>
          </div>
        </div>

        <!-- <div class="container-fluid">
          <div class="row">
            <div class="col-12 txt-right">
              {{footer}}
            </div>
          </div>          
        </div> -->

        <table class="table table-striped table-fullwidth table-hover cdss-table">
          <thead>
            <tr>
              <th></th>
              <th>รหัสชนิด<br />ยุทธภัณฑ์</th>
              <th>ชื่อชนิด<br />ยุทธภัณฑ์</th>
              <th>รหัสประเภท<br />ยุทธภัณฑ์</th>
              <!--<th>ชื่อประเภทยุทธภัณฑ์</th>-->
              <th>Cas No</th>
              <th>พิกัด</th>
              <th>รหัสสถิติ</th>
              <!-- <th class="cdss-col-nowrap">รหัส<br />หน่วยสินค้า</th> -->
            </tr>
          </thead>
          <tbody>

            <tr [hidden]="!isLoading">
              <td colspan="9" class="txt-center">
                <cdss-loading></cdss-loading>
              </td>
            </tr>
            <tr [hidden]="!noData">
              <td colspan="9" class="txt-center">
                Data not found.
              </td>
            </tr>

            <tr *ngFor=" let item of Datasource; let idx = index">
              <td><button class="btn btn-link btn-sm" (click)="selectProductGroup(item)">เลือก</button></td>
              <td>{{item.Code}}</td>
              <td>
                <div>{{item.Name}}</div>
                <div>({{item.TypeName}})</div>
              </td>
              <td>{{item.TypeCode}}</td>
              <!--<td>{{item.TypeName}}</td>-->
              <td class="cdss-col-nowrap">{{item.CasNo}}</td>
              <td class="cdss-col-nowrap">{{item.TariffCode}}</td>
              <td>{{item.StatisticalCode}}</td>
              <!-- <td>{{item.UnitName}}</td> -->
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td [hidden]="isLoading" colspan="7" class="txt-right">
                {{footer}}
              </td>
            </tr>
          </tfoot>
        </table>
        
        <cdss-datagrid-pagination #pg [hidden]="isLoading"></cdss-datagrid-pagination>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancelDialog()">Cancel</button>
        <button type="button" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>
</div>
